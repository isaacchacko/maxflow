name: check
on:
  push:
  pull_request:
    branches: [feat/v2, master]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # The boot test starts a session in tmux.
      - run: command -v tmux || (sudo apt-get update && sudo apt-get install -y tmux)
      - run: bun install --frozen-lockfile
      - run: bun run check
