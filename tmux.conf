# Invisible tmux: it only exists so sessions outlive the maxflow server.
set -g prefix None
unbind C-b
set -g status off
set -g history-limit 50000
set -sg escape-time 0
set -g default-terminal "xterm-256color"
set -sa terminal-features ",xterm-256color:RGB:extkeys:clipboard:focus"
set -g extended-keys on
set -g allow-passthrough on
set -g set-clipboard on
set -g focus-events on
set -g window-size latest
set -g remain-on-exit off
# The browser sees tmux's alternate screen, so wheel scrolling has to be tmux's copy mode, not xterm scrollback.
set -g mouse on
# Right-click opens maxflow's session menu in the browser, not tmux's in-pane one.
unbind -n MouseDown3Pane
