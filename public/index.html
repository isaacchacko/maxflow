<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>maxflow</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
  <style>
    :root { --bg: #0d0f12; --panel: #15181d; --line: #262b33; --fg: #d7dce2; --dim: #7d8590; --accent: #6cb6ff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
    body { display: grid; grid-template-columns: 240px 1fr; }
    aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    header { padding: 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    header b { color: var(--accent); }
    button { background: none; border: 1px solid var(--line); color: var(--fg); border-radius: 4px; padding: 3px 8px; font: inherit; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    ul { list-style: none; margin: 0; padding: 0; overflow: auto; }
    li { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 6px; align-items: center; }
    li.active { background: #1d2229; }
    li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li .dot { width: 7px; height: 7px; border-radius: 50%; background: #3fb950; flex: none; }
    li .dot.dead { background: var(--dim); }
    li .x { color: var(--dim); border: none; padding: 0 4px; }
    main { min-width: 0; min-height: 0; padding: 6px; }
    #term { height: 100%; }
    #empty { color: var(--dim); padding: 24px; }
    @media (max-width: 640px) { body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } aside { max-height: 30vh; } }
    #picker { position: fixed; inset: 0; background: #000a; display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px; z-index: 10; }
    #picker[hidden] { display: none; }
    #picker .box { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; width: min(760px, 100%); max-height: 80vh; display: flex; flex-direction: column; }
    #picker .bar { display: flex; gap: 10px; align-items: center; padding: 10px; border-bottom: 1px solid var(--line); }
    #picker input[type=search] { flex: 1; background: var(--bg); border: 1px solid var(--line); color: var(--fg); padding: 6px 8px; border-radius: 4px; font: inherit; }
    #picker label { color: var(--dim); white-space: nowrap; }
    #chats li { flex-direction: column; align-items: stretch; gap: 3px; }
    #chats li.sel { background: #1d2229; }
    #chats .t { color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #chats .m { color: var(--dim); font-size: 11px; display: flex; gap: 10px; }
    #chats .m .cwd { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
    .badge { color: #e3b341; } .badge.mf { color: var(--accent); }
    header .btns { display: flex; gap: 6px; }
  </style>
</head>
<body>
  <aside>
    <header><b>maxflow</b><span class="btns"><button id="resume" title="Resume a Claude chat (r)">resume</button><button id="new">+ new</button></span></header>
    <ul id="list"></ul>
  </aside>
  <div id="picker" hidden>
    <div class="box">
      <div class="bar"><input type="search" id="q" placeholder="Search chats by title, prompt, folder, id" autocomplete="off" /><label><input type="checkbox" id="bypass" /> bypass perms</label></div>
      <ul id="chats"></ul>
    </div>
  </div>
  <main><div id="term"></div><div id="empty" hidden>No sessions. Click + new.</div></main>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.js"></script>
  <script>
    const list = document.getElementById("list");
    let term, fit, ws, current;

    async function refresh() {
      const sessions = await (await fetch("/api/sessions")).json();
      list.replaceChildren(...sessions.map((s) => {
        const li = document.createElement("li");
        li.className = s.id === current ? "active" : "";
        li.title = `${s.cmd.join(" ")}\n${s.cwd}`;
        li.innerHTML = `<span class="dot ${s.running ? "" : "dead"}"></span><span class="name"></span><button class="x" title="kill">×</button>`;
        li.querySelector(".name").textContent = s.name;
        li.onclick = () => attach(s.id);
        li.querySelector(".x").onclick = async (e) => {
          e.stopPropagation();
          await fetch(`/api/sessions/${s.id}`, { method: "DELETE" });
          if (s.id === current) { ws?.close(); term?.dispose(); term = current = null; history.replaceState(null, "", "/"); }
          refresh();
        };
        return li;
      }));
      document.getElementById("empty").hidden = sessions.length > 0;
      if (!current && sessions.length) attach((sessions.find((s) => location.pathname === `/s/${s.id}`) ?? sessions[0]).id);
    }

    function attach(id) {
      if (id === current) return;
      ws?.close();
      term?.dispose();
      current = id;
      history.replaceState(null, "", `/s/${id}`);
      term = new Terminal({ fontFamily: "ui-monospace, SFMono-Regular, Menlo, monospace", fontSize: 13, cursorBlink: true, allowProposedApi: true, theme: { background: "#0d0f12" } });
      fit = new FitAddon.FitAddon();
      term.loadAddon(fit);
      term.loadAddon(new WebLinksAddon.WebLinksAddon());
      term.open(document.getElementById("term"));
      fit.fit();
      ws = new WebSocket(`ws://${location.host}/ws/${id}`);
      ws.binaryType = "arraybuffer";
      const send = (m) => ws.readyState === 1 && ws.send(JSON.stringify(m));
      ws.onopen = () => send({ type: "resize", cols: term.cols, rows: term.rows });
      ws.onmessage = (e) => term.write(new Uint8Array(e.data));
      ws.onclose = () => refresh();
      term.onData((data) => send({ type: "input", data }));
      term.onResize(({ cols, rows }) => send({ type: "resize", cols, rows }));
      term.focus();
      refresh();
    }

    const picker = document.getElementById("picker"), q = document.getElementById("q"), chatList = document.getElementById("chats"), bypass = document.getElementById("bypass");
    let chats = [], sel = 0, searchTimer;
    try { bypass.checked = localStorage.getItem("mf.bypass") !== "0"; } catch { bypass.checked = true; }
    bypass.onchange = () => { try { localStorage.setItem("mf.bypass", bypass.checked ? "1" : "0"); } catch {} };

    const ago = (t) => { const m = (Date.now() - t) / 60000; return m < 60 ? `${Math.round(m)}m` : m < 1440 ? `${Math.round(m / 60)}h` : `${Math.round(m / 1440)}d`; };
    const home = (p) => p.replace(/^\/Users\/[^/]+/, "~");

    function renderChats() {
      chatList.replaceChildren(...chats.map((c, i) => {
        const li = document.createElement("li");
        li.className = i === sel ? "sel" : "";
        li.title = c.prompt;
        li.innerHTML = `<span class="t"></span><span class="m"><span class="cwd"></span><span class="badge"></span><span>${ago(c.mtime)}</span></span>`;
        li.querySelector(".t").textContent = c.title;
        li.querySelector(".cwd").textContent = home(c.cwd);
        const badge = li.querySelector(".badge");
        if (c.session) { badge.textContent = "open in maxflow"; badge.classList.add("mf"); }
        else if (c.live) badge.textContent = "open elsewhere";
        li.onclick = () => resumeChat(c);
        return li;
      }));
      chatList.children[sel]?.scrollIntoView({ block: "nearest" });
    }

    async function loadChats() {
      chatList.innerHTML = `<li style="color:var(--dim)">loading…</li>`;
      chats = await (await fetch(`/api/chats?limit=150&q=${encodeURIComponent(q.value)}`)).json();
      sel = 0;
      renderChats();
    }

    async function resumeChat(c, force = false) {
      const res = await fetch(`/api/chats/${c.id}/resume`, { method: "POST", body: JSON.stringify({ bypass: bypass.checked, force }) });
      if (res.status === 409) {
        if (confirm(`"${c.title}" is already open in another claude process. Resuming it here too will fork the transcript. Continue?`)) return resumeChat(c, true);
        return;
      }
      if (!res.ok) return alert(await res.text());
      const s = await res.json();
      picker.hidden = true;
      current = null;
      attach(s.id);
    }

    function openPicker() { picker.hidden = false; q.value = ""; q.focus(); loadChats(); }
    document.getElementById("resume").onclick = openPicker;
    picker.onclick = (e) => { if (e.target === picker) picker.hidden = true; };
    q.oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(loadChats, 150); };
    q.onkeydown = (e) => {
      if (e.key === "ArrowDown") { sel = Math.min(sel + 1, chats.length - 1); renderChats(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); renderChats(); e.preventDefault(); }
      else if (e.key === "Enter" && chats[sel]) resumeChat(chats[sel]);
      else if (e.key === "Escape") { picker.hidden = true; term?.focus(); }
    };
    if (location.hash === "#resume") openPicker();

    document.getElementById("new").onclick = async () => {
      const cmd = prompt("Command (blank = login shell)", "") ?? null;
      if (cmd === null) return;
      const s = await (await fetch("/api/sessions", { method: "POST", body: JSON.stringify({ cmd: cmd || undefined }) })).json();
      current = null;
      attach(s.id);
    };
    new ResizeObserver(() => fit?.fit()).observe(document.querySelector("main"));
    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
